# appforge-control/config/agents.yaml
#
# The initial seven agents (§6.2), in the shape §29f's example established
# (extended with a few extra fields — `wakes`, `notes` — that the two-agent
# example didn't need but §6.2's fuller per-agent tables do).
#
# Budgets: sum to 8000 cents ($80) of the $100/mo company cap — the remaining
# $20 is $15 reserve/overrun + $5 model-eval (see budgets.yaml, §6.2, §28).
# Concrete model IDs live only in models.yaml — `tier` here just selects
# LOW/NORMAL/HIGH/CRITICAL, the router (§7) resolves it to a model.
#
# RULING on fixed tiers (§7.3, Phase 1): "Only Builder gets a variant
# initially (others have a fixed tier)." Several §6.2 rows describe a range
# (e.g. CEO "LOW for daily all-normal, HIGH for portfolio reviews"). Since
# Phase 1 gives each non-Builder agent exactly one adapter tier, this file
# picks the higher-stakes tier as the fixed default and leaves a comment
# citing the lower-cost case from §6.2 — the router's budget-downgrade rule
# (§7.2: budget < 20% remaining ⇒ drop one tier) already covers cost control
# within that fixed tier for routine, low-stakes runs.

# Capability strings (`capabilities:` on each agent below) are DEFINED in
# docs/capabilities.md, and nowhere else. Nothing in this repo reads or
# validates them — they are read by humans and by agents deciding how to route
# work, which is exactly why an undefined one is dangerous rather than untidy.
# APP-194: `browser:e2e` was granted here and defined nowhere, was therefore
# read as "QA can drive a browser", and APP-54 was routed to QA on that reading
# for a Chrome Web Store dashboard export it could never have done. Grant and
# definition change in the same PR, always.

schema: appforge/agents@1

# Run turn ceiling (APP-29). Previously this lived only in each agent's
# Paperclip adapterConfig (`maxTurnsPerRun`) at 10, which is below the floor
# for real work: gathering routine inputs (approvals + issues + agent state)
# alone costs 4-6 turns, so any run that then had to *act* died with
# `error_max_turns` before finishing. It took out CPO, CEO, Analyst and CTO
# runs company-wide.
#
# 40 is the baseline: ~6 turns of input gathering + ~25 turns of actual work
# + ~8 turns of write-up and handoff, with a little slack. Builder gets 60
# because its work is the most tool-dense in the company (multi-file edits
# plus CI/test iteration loops), and a Builder that dies mid-PR leaves a
# dirty branch behind rather than just losing a comment.
#
# This is NOT a cost control and does not change any budget: spend stays
# bounded by each agent's `budget_cents` below and by the company cap
# (DEC-0004 unchanged). A turn cap only decides whether a run finishes its
# work or is killed partway through; `budget_cents` decides what it may spend.
# The router's budget-downgrade rule (§7.2) is untouched.
#
# Run concurrency ceiling and timer heartbeats (APP-39). `heartbeat.timer` and
# `heartbeat.max_concurrent` below map onto Paperclip's
# `runtimeConfig.heartbeat.{enabled,maxConcurrentRuns}`.
#
# RULING: `timer: false` stays false for all seven agents in Phase 1. It is not
# a misconfiguration. Grounds:
#
#   * `enabled` gates ONLY `source === "timer"`. Every other wake source
#     (assignment, comment, mention, approval, webhook, routine) is gated by a
#     different field, `wakeOnDemand`, which defaults to TRUE when absent. So
#     `enabled: false` does not stop any wake this company actually relies on.
#   * Scheduled work arrives through routines, not timers, and routines already
#     fire with `enabled: false` - the daily/weekly CEO, Analyst, CPO and Growth
#     routines are `active` in the control plane and have created real execution
#     issues. The `routines:` list under each agent below IS the schedule.
#   * Turning timers on needs TWO gates, not one: the scheduler loop requires
#     `enabled && intervalSec > 0`. Setting `enabled: true` alone changes
#     nothing, so "flip enabled" was never a one-line fix.
#   * Cost: a timer wake spends a model call even when the do-nothing rule
#     (Sec 6.1 rule 2) means the run posts nothing. At $80/mo across seven
#     agents (DEC-0004) polling is the wrong shape for this company.
#
# If Phase 2 ever wants timers, set `timer: true` AND an interval, and pair it
# with Paperclip's `skipTimerWhenNoActionableWork` (suppresses a generic timer
# wake when the agent has no todo/in_progress issue) plus the per-agent
# `maxDailyRuns` / `maxDailyCostCents` caps. Do not enable timers without them.
#
# `max_concurrent` is a real per-agent ceiling on how many QUEUED runs may be
# promoted to running at once. Paperclip's own default is 20, which is what
# every agent inherited at creation - nobody chose it. 20 concurrent runs at a
# 40-60 turn cap is an indefensible ceiling on a 2-OCPU laptop, so this file
# now states a number per agent. Over-ceiling wakes QUEUE, they are not
# dropped, which is what makes a low ceiling safe. Valid range is 1-50.
defaults:
  max_turns_per_run: 40
  max_concurrent: 2   # one long run in flight plus one event wake (approval resolution, CI webhook), without letting a pile-up fan out into N simultaneous sessions

agents:
  - name: ceo
    adapter: claude_local
    tier: HIGH   # HIGH is the ceiling (portfolio reviews, cross-team conflicts); §6.2 also names LOW for "all-normal" daily reports — that path posts a fixed deterministic template and never calls the model at all (see agents/ceo/HEARTBEAT.md), so it doesn't need its own tier entry here
    budget_cents: 1500
    max_turns_per_run: 40
    heartbeat:
      timer: false
      routines: [daily-0700, weekly-mon-0900]
      wakes: [mention, approval_resolution]
    capabilities: [paperclip:company, metrics:read, brain:pr]
    reports_to: board

  - name: cpo
    adapter: claude_local
    tier: NORMAL   # §6.2: NORMAL for research (the bulk of CPO's work); HIGH only for the G2 validation verdict — same Phase-1 fixed-tier tradeoff as CEO above
    budget_cents: 1200
    max_turns_per_run: 40
    heartbeat:
      timer: false
      routines: [weekly-wed-1000]   # opportunity scouting batch, cap 5 opportunities per run (§5.3)
      wakes: [assignment, mention]
    capabilities: [web:research, brain:pr, metrics:read]
    reports_to: ceo

  - name: cto
    adapter: claude_local
    tier: HIGH
    budget_cents: 1500
    max_turns_per_run: 40
    heartbeat:
      timer: false
      routines: []
      wakes: [assignment, mention, "webhook:pr_ready_for_review", "webhook:ci_failed_on_main"]
    capabilities: [repo:write:platform, repo:write:products, repo:review, ci:read, release:staging, "release:production:approval_gated"]
    reports_to: ceo
    notes: "CRITICAL-risk reviews additionally get a codex_local second opinion (independent review) per §6.2/§7.1 — this is the CRITICAL tier's independent_review field in models.yaml, run as a second agent turn, not a separate Paperclip agent identity."

  - name: builder
    adapter: claude_local
    tier: NORMAL
    variants: { high: HIGH }   # the one Phase-1 variant (§7.3): a separate `builder-high` Paperclip agent identity sharing these instruction files but routed to the HIGH model
    budget_cents: 2000   # largest single consumer of the $80 (§6.2)
    max_turns_per_run: 60   # most tool-dense role (multi-file edits + CI/test loops); see defaults above
    heartbeat:
      timer: false
      routines: []
      wakes: [assignment, "mention:pr", "mention:issue"]
      max_concurrent: 1   # VM/laptop has 2 OCPU (§6.2) — do not run a second Builder job concurrently. Declared since P0-06 but never applied to the control plane until APP-39 built the reconciler; Builder was running at Paperclip's default of 20.
    capabilities: [repo:write:assigned, ci:read]
    reports_to: cto

  - name: qa
    adapter: claude_local
    tier: NORMAL   # §6.2: "tests themselves are deterministic" — the LLM here is for test *planning* and evidence write-up, not the test runs
    budget_cents: 800
    max_turns_per_run: 40
    heartbeat:
      timer: false
      routines: []
      wakes: [handoff_assignment, "webhook:pr_ready"]
      max_concurrent: 1   # holds a browser e2e session and a repo checkout - two concurrent runs would collide on the same workspace
    # VERIFIED (APP-194, 2026-09-29): `browser:e2e` is real and was NOT removed.
    # It was filed as a phantom grant on the strength of a search scoped to this
    # repo, which is the wrong place to look — test tooling lives in the kit.
    # `@appforge/e2e` (appforge-kit `packages/e2e`, commit c128399) is merged,
    # Playwright 1.63.0 and its Chromium are installed, the package's own suite
    # runs 10/10 green against a real browser, and `appforge test --e2e` returns
    # ok:true end to end. What `browser:e2e` cannot do is touch an authenticated
    # session: it launches an empty throwaway profile with no cookies and no
    # relationship to the founder's Brave. That boundary, not the grant, is what
    # mis-routed APP-54. See docs/capabilities.md.
    capabilities: [repo:read, repo:tests-pr, browser:e2e]
    reports_to: cto

  - name: growth
    adapter: claude_local
    tier: NORMAL   # §6.2 also names LOW "for variants" (e.g. A/B copy variants) — same Phase-1 fixed-tier tradeoff as CEO/CPO above
    budget_cents: 600
    max_turns_per_run: 40
    heartbeat:
      timer: false
      routines: [weekly-fri-1000]   # experiment status (§5.3/§6.2)
      wakes: [assignment]
    capabilities: [brain:pr, metrics:read, hubsite:pr]
    reports_to: ceo

  - name: analyst
    adapter: claude_local
    tier: NORMAL   # §6.2: "narrative: LOW/NORMAL; all math: scripts" — narrative writing (esp. the weekly board report, §5.3) is the higher-stakes default; the math itself never goes through the router at all (it's in models.yaml's deterministic_tasks: pnl_math)
    budget_cents: 400
    max_turns_per_run: 40
    heartbeat:
      timer: false
      # RULING (APP-50): `daily-0630-if-anomalies` is REMOVED from this list, not
      # deferred in place. §6.2 gates it on "the ingest job's deterministic
      # anomaly check" — and that check does not exist. There is no ingest to
      # read (config/analytics.yaml is `enabled: false`, endpoint null, pending
      # appforge-edge/P1-10) and no evaluator to flag with (APP-43 owns
      # `appforge metrics digest`, and is blocked). A routine whose only trigger
      # condition can never be true either does not fire, or fires
      # unconditionally and spends a model call to conclude nothing — the exact
      # polling shape the APP-39 ruling above rejected on cost grounds, against
      # the smallest budget in the company (400 cents).
      #
      # This file must describe the control plane, not aspire to it: it claimed
      # six routines where five existed. Restore this entry in the SAME commit
      # that creates the routine, once APP-43 ships a digest that can set an
      # anomaly flag. See agents/analyst/HEARTBEAT.md for the wake's contract,
      # which is unchanged and still correct for that future state.
      routines: [weekly-mon-0730]
      wakes: []
    capabilities: [metrics:read, "metrics:ingest:read-only"]
    reports_to: ceo
    notes: "Reports to CEO, not Growth/CGO, so measurement stays independent of the team being measured (§5.1)."
