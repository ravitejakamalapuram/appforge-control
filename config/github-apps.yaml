# GitHub Apps used to mint scoped, short-lived installation tokens for agents
# (P1-05, master plan §11.3/§17). No secrets in this file — App IDs and Client
# IDs are not sensitive; the private key lives outside git at
# secrets/<name>.private-key.pem (gitignored) and is never committed.
apps:
  - name: appforge-agents
    purpose: "Day-to-day agent work: repo:write on assigned product, PRs, issues. No actions:write — agents cannot dispatch release workflows."
    app_id: 5099019
    client_id: "Iv23liOwKIHj2BDxRkf8"
    private_key_path: secrets/appforge-agents.private-key.pem
    permissions:
      contents: write
      issues: write
      pull_requests: write
      checks: read
      actions: read
      metadata: read # mandatory, GitHub-imposed
    installed_on:
      - appforge-kit
      - appforge-control
      - appforge-brain
      - echokit
      - json-workbench
      - TelePort
      - StellarTab
      - GitaVerses
      - TeluguPanchangam
      - cors-enabler
      - session-transfer
      - InvTrack # onboarded 2026-09-30: treated like every other product repo (founder decision)
      - release-platform # added 2026-10-01 (founder decision): agents may push BRANCHES and open draft PRs here. Preconditions met first: main is protected (PR required, no force-push/deletion), and `workflows` stays withheld, so .github/workflows/** still goes through the board's assistant. Merge and release dispatch remain the assistant's/founder's.
    # NOTE (2026-09-30): InvTrack was previously excluded here under an "extra-care" policy. The
    # founder removed that special status: InvTrack is now an ordinary product repo, in `installed_on`
    # and in the agents' APPFORGE_AGENT_REPOS like the rest. The GitHub App installation already
    # included it. `release-platform` was outside the installation until 2026-10-01 (see installed_on).
    # Release DISPATCH (actions:write) still belongs to a separate, more locked-down appforge-release App
    # (not yet created); nothing in this App can dispatch a release.
    deliberately_excluded: []

  # appforge-release: NOT YET CREATED, and its permission set is NOT settled.
  # The ruling is open on APP-92. Do not create this App from the sketch that
  # used to sit here ("needs actions:write on release-platform only") - that
  # sketch is unsafe as written and is why this block was rewritten.
  #
  # Why the old sketch is unsafe: it assumed the private key could be fenced to
  # "the CTO/Release agent's env" (master plan §17.1). It cannot be, on this
  # machine. Every agent runs under ONE uid and every key in secrets/ is
  # readable by all of them (agent-launch.sh, WHAT THIS DOES NOT CLOSE item 1;
  # DEC-0016). github-app-token.mjs takes --app, so any agent can mint from any
  # App listed here. An actions:write key in this directory is therefore a
  # production-release dispatch button for EVERY agent, including low-trust
  # ones - the exact opposite of what the release-platform exclusion holds.
  #
  # Constraints any future spec must satisfy, measured 2026-09-29 (APP-92):
  #   - release-platform is a PUBLIC repo. Its workflows and history are
  #     world-readable; a bad push there is a public event, not an internal one.
  #   - App installation tokens are refused on .github/workflows/** unless the
  #     App holds `workflows` permission ("refusing to allow a GitHub App to
  #     create or update workflow ... without `workflows` permission",
  #     reproduced against appforge-control this run). So the release pipeline
  #     definitions stay out of agent reach as long as `workflows` is withheld
  #     - that one is enforced by GitHub, not by us. See APP-138.
  #   - `contents: write` alone still permits a direct push to main unless
  #     branch protection requires a PR. Protection on release-platform's main
  #     is a precondition of any write-capable install, not a nice-to-have.
  #
  # Split the two jobs; do not give one App both:
  #   1. Opening PRs on release-platform (what APP-69 needs today):
  #      contents: write, pull_requests: write, metadata: read. No actions,
  #      no workflows, no administration.
  #   2. Dispatching a release (actions: write): stays with the founder's own
  #      gh CLI until agents are uid-isolated. Nothing in secrets/ can hold a
  #      dispatch-capable key before then.
