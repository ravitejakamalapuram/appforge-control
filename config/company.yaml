# appforge-control/config/company.yaml
#
# Single-company config (§29f). This describes the one Paperclip "Company"
# object (§4.1: "Company | AppForge AI (single company)").

schema: appforge/company@1

company:
  name: "AppForge AI"

  # Placeholder — do NOT invent an id. This is only knowable once Paperclip's
  # company API is confirmed working (P0-05) and a company is actually
  # created there; that is a live-instance action, out of scope for this
  # config-file pass (a separate agent is currently working on Paperclip's
  # Claude-account auth — this file intentionally does not touch that).
  # Master-plan example shape: paperclip_company_id: "<set at P0-05>"
  paperclip_company_id: "18b2b6ef-fbaa-48d1-acf4-168841c269ae" # AppForge AI (APP-150: set 2026-10-01)

  north_star: contribution_per_founder_hour   # §27: Monthly Portfolio Contribution per Founder-Hour

  budget_monthly_cents: 10000   # $100/mo cap — must match budgets.yaml's monthly_cents.company

  timezone: Asia/Kolkata

  autonomy_default: L2   # §24.2: "builds/tests, human releases" — "Start L2 for factory work, L1 for anything outside it"

  # Placeholder — the ntfy.sh topic is a separate, not-yet-set-up integration
  # (still null as of 2026-09-28). Because this is null, security.yaml's §16.2
  # notify policy has been corrected to name the board approval queue instead of
  # a push alert — see the CONTAINMENT / notify_founder block there (APP-78).
  # (§28 lists ntfy.sh as a planned $0 dependency, but nothing has provisioned
  # an actual unguessable topic yet). Do not fill in a guessed topic name.
  # Master-plan example shape: founder_notify: ntfy://appforge-founder-<random>
  founder_notify: null
