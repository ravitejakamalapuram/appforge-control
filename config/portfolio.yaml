# ===========================================================================
# 11. Q4 GOAL BASELINE (O2)
# ===========================================================================
baselines:
  json_workbench_wau:
    goal_ref: "appforge-brain/strategy/2026-q4-goals.md — 'JSON Workbench: WAU +30% by 2026-12-31'"
    metric: cws_weekly_users
    observations:
      - { value: 5, surface: cws_developer_dashboard, date: "2026-09-27" }
      - { value: 3, surface: cws_public_listing,      date: "2026-09-28" }
    observations_retained_unreconciled: |
      DEC-0009 O2: both surfaces and both dates are RETAINED, unreconciled,
      by default. Per §6.2 a bad number gets flagged and explained, never
      quietly corrected, and there is no basis to prefer one surface over the
      other — the CWS CSV export's own column header is what settles it
      (APP-54). Do not collapse these two rows into one number.
    baseline_value: null
    provisional_band: [3, 5]
    certified: false
    why_not_certified: |
      Two surfaces, two values, one day apart, no export in hand. A baseline
      needs ≥4 weekly observations from one surface; the product is 8 days old.
    goal_is_scoreable: false
    finding: |
      +30% on a base of 3–5 is a target of 4–7 users. The smallest change the
      instrument can express is 1 user (20–33%) and the observed disagreement
      between two Google surfaces is 2 users (40%). THE TARGET EFFECT IS
      SMALLER THAN THE INSTRUMENT'S DEMONSTRATED ERROR. O2 is unscoreable as
      written, and shipping telemetry would not fix it — the problem is n, not
      instrumentation. It becomes scoreable at roughly n ≥ 30.
    confidence: high      # on the arithmetic
    restatement_pending:
      proposed_goal: "json-workbench cws_weekly_users >= 50 on the 2026-12-29 export, 4-week trailing mean"
      threshold: 50
      threshold_basis: |
        CEO amended Analyst's proposed 40 to 50 to match §22.1's own day-90
        WAU floor. Using the policy's existing number rather than a fresh one
        means the goal and the kill clause cannot disagree about what "enough
        users" means.
      as_of_date: "2026-12-29"
      aggregation: "4-week trailing mean, single surface"
      why_absolute_not_percentage: "Absolute targets are scoreable at any n; percentage targets on a base of 3 are not. Consistent with OPP-0001's pre-registered falsifier (a)."
      ratification_status: PENDING_FOUNDER
      tracked_on: APP-55
      applied_here: false
      applied_here_note: |
        RECORDED, NOT APPLIED. `strategy/` is founder-approval content;
        Analyst records the defect and the restatement and does not edit the
        goal. `goal_ref` above still points at the goal as currently written,
        and `goal_is_scoreable` stays false until APP-55 resolves. If the
        founder declines, this block stays here as the record of a goal known
        to be unscoreable — which is the point of recording it.
