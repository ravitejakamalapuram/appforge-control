  # Corrected to null per this issue's own rule: do not guess a date.
  json-workbench:   { platform: chrome,  store_item_status: published,     first_published: null, expected_outcome: not_applicable, reason: "published, but first_published unrecoverable from repo evidence — backfill from the CWS listing in the founder session" }
  echokit:          { platform: chrome,  store_item_status: published,     first_published: null, expected_outcome: not_applicable, reason: "first_published unknown" }
  stellartab:       { platform: chrome,  store_item_status: published,     first_published: null, expected_outcome: not_applicable, reason: "first_published unknown" }
  session-transfer: { platform: chrome,  store_item_status: published,     first_published: null, expected_outcome: not_applicable, reason: "first_published unknown" }
  telugupanchangam: { platform: chrome,  store_item_status: unpublished,   first_published: null, expected_outcome: not_applicable, reason: "awaiting free CWS slot (§13.6)" }
  gitaverses:       { platform: chrome,  store_item_status: unpublished,   first_published: null, expected_outcome: not_applicable, reason: "awaiting free CWS slot (§13.6)" }
