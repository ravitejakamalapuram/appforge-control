# appforge-control/config/security.yaml
#
# High-risk permission list + thresholds for the deterministic gate
# `appforge security permissions` (§13.2) and the security pipeline (§13.4).
#
# §29f's own configuration-example list is an abbreviated version of §13.2's
# prose list (missing declarativeNetRequestWithHostAccess, tabs, scripting,
# downloads). This file uses §13.2's fuller prose list as the source of
# truth, since that's where the permission-governance design is actually
# specified — the §29f example undercounts it.

schema: appforge/security@1

# Any permission on this list, if added to a shipped manifest, forces
# risk:high, a CRITICAL review, board approval, and a CWS privacy-tab update
# task (human) — §13.2.
high_risk_permissions:
  - cookies
  - history
  - webRequest
  - webRequestBlocking
  - declarativeNetRequestWithHostAccess
  - debugger
  - tabs                # conditional: high-risk specifically when used to read URLs, not just tab counts/titles (§13.2)
  - scripting           # conditional: high-risk specifically when combined with broad host permissions below (§13.2)
  - "<all_urls>"
  - "*://*/*"
  - management
  - downloads
  - clipboardRead
  - nativeMessaging
  - identity

thresholds:
  fail_on: SEV2
  secret_scan: gitleaks
  deps: [npm-audit, osv-scanner]

# §16.2 — CORRECTED 2026-09-28 (APP-78, from APP-73). The original text here read
# "SEV0/SEV1 notify the founder immediately (ntfy high priority for SEV0)". That
# described a channel that does not exist: `config/company.yaml` has
# `founder_notify: null` and ntfy.sh was never provisioned (§28 lists it as
# planned). A policy asserting a notification that silently does not fire is the
# same class of defect as a containment claim that is not enforced — and worse,
# because it fails at exactly the moment it was supposed to work.
#
# What actually happens today: nothing pages anyone. A SEV0/SEV1 reaches the
# founder only when they next open the board approvals queue — latency is
# "whenever the founder next looks", which on a work laptop can be many hours or
# a weekend. Plan incident response around that, not around a push alert.
#
# So this key now names the queue that exists. Do NOT restore an ntfy reference
# here until a real topic is provisioned, and do NOT guess a topic name — the
# placeholder in company.yaml says so, and an unguessable topic is the founder's
# to create. Tracked separately; see APP-78's follow-up.
notify_founder_channel: board_approval_queue   # the only channel that exists
notify_founder_latency: unbounded              # no push; founder-poll only
notify_founder: [SEV0, SEV1]                   # severities that MUST reach the founder

# ---------------------------------------------------------------------------
# CONTAINMENT — read before changing how this instance is reached
#
# The OS uid is the ONLY agent containment boundary. The control plane does NOT
# contain agents: Paperclip runs with `server.deploymentMode = "local_trusted"`
# in ~/.paperclip/instances/default/config.json, and in that mode the auth
# middleware defaults every request's actor to board/instance-admin BEFORE it
# examines any credential. Measured read-only 2026-09-28: a GET of this
# company's issue list with no Authorization header returned 200 and every
# issue. Deny lists in agents/*/TOOLS.md and APPFORGE_AGENT_REPOS=none are
# cooperative; the per-run cross-issue write cap and the run-attribution audit
# trail bind credentialed writes only. Ruling: DEC-0016 (APP-73, board approval
# e028e2f9). Full model: docs/containment-model.md.
#
# >>> REVISIT TRIGGER — DEC-0016 IS VOID IMMEDIATELY IF ANY OF THESE IS TRUE <<<
#   1. `server.bind` is no longer `loopback`, or `server.host` is no longer
#      `127.0.0.1` (i.e. the instance is reachable off this host).
#   2. This machine becomes multi-user, or a second person gets agent access.
#   3. `server.deploymentMode` changes from `local_trusted`.
# Any of these requires re-scoping `deploymentMode: authenticated` as a BOARD
# APPROVAL before agents continue running. The whole accepted-risk position
# rests on single-user + loopback; remove either and it is not accepted risk any
# more, it is an open control plane on a network.
#
# Migration to `authenticated` is DEFERRED (declined on APP-73), not in
# progress. Do not schedule or plan around it.
# ---------------------------------------------------------------------------
